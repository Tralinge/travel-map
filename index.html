<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Travel Map</title>

<!-- Leaflet CSS -->
<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<!-- MarkerCluster CSS -->
<link rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

<style>
html, body {
  height: 100%;
  margin: 0;
}

/* ===== LAYOUT ===== */
#container {
  display: flex;
  height: 100%;
  width: 100%;
}

#map {
  flex: 2;
}

#sidebar {
  flex: 1;
  max-width: 400px;
  padding: 12px;
  overflow-y: auto;
  border-left: 1px solid #ccc;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background-color: #f9f9f9;
  margin: 0 auto;
}

#sidebar img {
  width: 100%;
  margin-bottom: 12px;
  border-radius: 6px;
  cursor: pointer;
}

#sidebar-handle {
  display: none;
}

/* ===== CUSTOM YEAR MARKER ===== */
.year-div-icon {
  background: transparent !important;
  border: none !important;
}

.year-marker {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.year-label {
  display: none;
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  font-size: 11px;
  font-weight: 600;
  background: rgba(255, 255, 255, 0.95);
  padding: 2px 6px;
  border-radius: 8px;
  margin-bottom: 6px;
  box-shadow: 0 0 2px rgba(0,0,0,0.3);
  pointer-events: none;
}

/* Visible only when marker is hovered */
.year-marker.hover .year-label {
  display: block;
}

.pin {
  width: 12px;
  height: 12px;
  flex-shrink: 0;
  border-radius: 50%;
  border: 2px solid white;
  box-shadow: 0 0 3px rgba(0,0,0,0.4);
}

/* ===== LIGHTBOX ===== */
#lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 2000;
}

#lightbox-close {
  position: sticky;
  top: 10px;
  right: 14px;
  font-size: 36px;
  color: #d4d3cf;
  cursor: pointer;
  background: rgba(0,0,0,0.6);
  border-radius: 10px;
  padding: 6px 4px;
}

.lightbox-inner {
  display: flex;
  align-items: center;
  justify-content: center;
  max-width: 95%;
  max-height: 80%;
}

#lightbox-img {
  max-width: 85vw;
  max-height: 75vh;
  border-radius: 6px;
}

.lightbox-arrow {
  font-size: 48px;
  color: #fff;
  cursor: pointer;
  padding: 12px;
  user-select: none;
}

/* ===== DOTS ===== */
#lightbox-dots {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

#lightbox-dots span {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,0.4);
  cursor: pointer;
}

#lightbox-dots span.active {
  background: rgba(255,255,255,0.9);
}

/* ===== IMAGES ===== */
.photo-wrapper {
  width: 100%;
  aspect-ratio: 4 / 3;
  background: #f0f0f0;
  overflow: hidden;
  margin-bottom: 12px;
}
.photo-wrapper img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  opacity: 0;
  transition: opacity 200ms ease;
}
.photo-wrapper img.loaded {
  opacity: 1;
}


/* ===== MOBILE ===== */
@media (max-width: 768px) {
  #container {
    flex-direction: column;
    height: 100dvh;
  }

  #map {
    flex: 1 1 auto;
  }

  #sidebar {
    padding-top: 0;
    flex: none;
    width: 100%;
    max-width: none;
    margin: 0;
    box-sizing: border-box;
    height: 20%;
    transition: height 0.25s ease;
  }

  #sidebar.collapsed {
    height: 20%;
  }

  #sidebar.expanded {
    height: 70%;
  }

  #sidebar-handle {
    display: block;
    position: sticky;
    top: 0;
    z-index: 10;
    background-color: #f2f2f2;
    border-bottom: 1px solid #ddd;
    padding: 4px 0;
    box-shadow: none;
    transition: background-color 150ms ease;
  }

  #sidebar.scrolled #sidebar-handle {
    box-shadow: 0 -2px 6px rgba(0, 0, 0, 0.08);
  }
      
  #sidebar-handle::before {
    content: "";
    display: block;
    width: 48px;
    height: 4px;
    margin: 0 auto;
    border-radius: 5px;
    background-color: #999;
  }      
  #sidebar-handle:hover {
    background-color: #e0e0e0;
  }
  #sidebar-handle:active {
    cursor: grabbing;
    transform: scaleX(1.05);
  }

  @keyframes handle-nudge {
    0% {
      transform: translateY(0);
    }
    40% {
      transform: translateY(-6px);
    }
    100% {
      transform: translateY(0);
    }
  }

  #sidebar-handle.nudge {
    animation: handle-nudge 420ms cubic-bezier(0.4, 0.0, 0.2, 1);
  }

  .lightbox-arrow {
    font-size: 36px;
  }

  #lightbox-dots span {
    width: 10px;
    height: 10px;
  }

  .leaflet-top {
    top: 60px;
  }
}
</style>
</head>

<body>

<div id="container">
  <div id="map"></div>
  <div id="sidebar" class="collapsed">
    <div id="sidebar-handle"></div>
    <div id="place-content">
      <p>Click a marker on the map to see photos.</p>
    </div>
  </div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <span id="lightbox-close">&times;</span>

  <div class="lightbox-inner">
    <span id="lightbox-prev" class="lightbox-arrow">&#10094;</span>
    <img id="lightbox-img" alt="">
    <span id="lightbox-next" class="lightbox-arrow">&#10095;</span>
  </div>

  <div id="lightbox-dots"></div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
/* ============================================================
   CONFIGURATION
   Centralized constants to avoid magic numbers and simplify tuning
============================================================ */

const CONFIG = {
  initialView: [20, 0],
  initialZoom: 2,
  focusZoom: 6,
  clusterRadius: 20,
  fitPadding: [50, 50],
  mobileBreakpoint: 768,

  // Wavelength range used to encode year → color
  WL_MIN: 410,
  WL_MAX: 680
};


/* ============================================================
   STATE
   Tracks current sidebar / lightbox context
============================================================ */

let currentPhotos = [];
let currentIndex = 0;

function setSidebarState(state) {
  sidebar.classList.remove('collapsed', 'expanded');
  sidebar.classList.add(state);
}

/* ============================================================
   DOM REFERENCES
============================================================ */

const sidebar = document.getElementById("sidebar");
const handle = document.getElementById("sidebar-handle");
      
/* ============================================================
   COLOR MAPPING (YEAR → RGB)
   Older years map to cooler colors, newer years to warmer colors
============================================================ */

function yearToWavelength(year, minYear, maxYear) {
  if (minYear === maxYear) {
    return (CONFIG.WL_MIN + CONFIG.WL_MAX) / 2;
  }

  return CONFIG.WL_MAX -
    ((year - minYear) / (maxYear - minYear)) *
    (CONFIG.WL_MAX - CONFIG.WL_MIN);
}

function wavelengthToRGB(wl) {
  let r = 0, g = 0, b = 0;

  if (wl < 440) {
    r = -(wl - 440) / 30;
    b = 1;
  } else if (wl < 490) {
    g = (wl - 440) / 50;
    b = 1;
  } else if (wl < 510) {
    g = 1;
    b = -(wl - 510) / 20;
  } else if (wl < 580) {
    r = (wl - 510) / 70;
    g = 1;
  } else if (wl < 645) {
    r = 1;
    g = -(wl - 645) / 65;
  } else {
    r = 1;
  }

  const to255 = v =>
    Math.round(255 * Math.pow(Math.max(v, 0.35), 0.8));

  return `rgb(${to255(r)},${to255(g)},${to255(b)})`;
}

/* ============================================================
   MAP INITIALIZATION
============================================================ */

const map = L.map("map", { zoomControl: false })
  .setView(CONFIG.initialView, CONFIG.initialZoom);

const worldBounds = L.latLngBounds(
  [-90, -180],
  [90, 180]
);

map.setMaxBounds(worldBounds);

L.control.zoom({ position: "bottomright" }).addTo(map);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  noWrap: true
}).addTo(map);

map.setMaxBounds(worldBounds);
map.options.maxBoundsViscosity = 1.0;

const markerCluster = L.markerClusterGroup({
  maxClusterRadius: CONFIG.clusterRadius
});


/* ============================================================
   SIDEBAR
============================================================ */

function updateSidebar(place) {
  sidebar.scrollTop = 0;
  const title = place.title ?? "Untitled";
  const text = place.text ?? "";
  const year = place.year ?? "";

  document.getElementById("place-title").textContent =
    `${year} - ${text} - ${title}`;

  const content = document.getElementById("place-content");
  content.innerHTML = "";

  currentPhotos = place.photos ?? [];

  currentPhotos.forEach((src, index) => {
    const wrapper = document.createElement('div');
    wrapper.className = 'photo-wrapper';
        
    const img = document.createElement("img");
    img.src = src;
    img.onclick = () => openLightbox(index);
    wrapper.appendChild(img);
    content.appendChild(wrapper);

    img.addEventListener('load', () => {
    img.classList.add('loaded');
});

  });
}

sidebar.addEventListener("scroll", () => {
  if (sidebar.scrollTop > 0) {
    sidebar.classList.add("scrolled");
  } else {
    sidebar.classList.remove("scrolled");
  }
});

/* HANDLEBAR ANIMATION */
let handleNudgeInterval = null;
let handleHasBeenUsed = false;

function startHandleNudge() {
  if (handleHasBeenUsed) return;

  handleNudgeInterval = setInterval(() => {
    if (handleHasBeenUsed) {
      stopHandleNudge();
      return;
    }

    handle.classList.remove('nudge');
    // force reflow to allow retrigger
    void handle.offsetWidth;
    handle.classList.add('nudge');
  }, 8000);
}

function stopHandleNudge() {
  if (handleNudgeInterval) {
    clearInterval(handleNudgeInterval);
    handleNudgeInterval = null;
  }
}

function markHandleUsed() {
  handleHasBeenUsed = true;
  stopHandleNudge();
  handle.classList.remove('nudge');
}

handle.addEventListener('click', () => {
  markHandleUsed();
});

map.on('click', () => {
  markHandleUsed();
});

function onMarkerSelected() {
  markHandleUsed();
}

if (sidebar.classList.contains('collapsed')) {
  startHandleNudge();
}

/* ============================================================
   MARKER CREATION
============================================================ */

function createPlaceMarker(place, minYear, maxYear) {
  const color = wavelengthToRGB(
    yearToWavelength(place.year, minYear, maxYear)
  );

  const icon = L.divIcon({
    className: "year-div-icon",
    html: `
      <div class="year-marker">
        <div class="year-label"></div>
        <div class="pin" style="background:${color}"></div>
      </div>
    `,
    iconAnchor: [6, 6]
  });

  const marker = L.marker([place.lat, place.lng], { icon });

  // Click → focus map and update sidebar
  marker.on("click", () => {  
    map.setView([place.lat, place.lng], CONFIG.focusZoom);
    updateSidebar(place);
    onMarkerSelected();

    if (window.innerWidth <= CONFIG.mobileBreakpoint) {
      setSidebarState('expanded');
    }
  });

  // Hover → show year/title label
  marker.on("mouseover", e => {
    const el = e.target.getElement();
    if (!el) return;

    const markerDiv = el.querySelector(".year-marker");
    const label = el.querySelector(".year-label");

    if (markerDiv && label) {
      label.textContent = `${place.year} – ${place.text} - ${place.title}`;
      markerDiv.classList.add("hover");
    }
  });

  marker.on("mouseout", e => {
    const el = e.target.getElement();
    if (!el) return;

    const markerDiv = el.querySelector(".year-marker");
    if (markerDiv) {
      markerDiv.classList.remove("hover");
    }
  });

  return marker;
}


/* ============================================================
   DATA LOADING
============================================================ */

fetch("places.json")
  .then(response => response.json())
  .then(places => {
    if (!Array.isArray(places) || places.length === 0) return;

    const years = places.map(p => p.year);
    const minYear = Math.min(...years);
    const maxYear = Math.max(...years);

    const bounds = L.latLngBounds();

    places.forEach(place => {
      const marker = createPlaceMarker(place, minYear, maxYear);
      markerCluster.addLayer(marker);
      bounds.extend([place.lat, place.lng]);
    });

    map.addLayer(markerCluster);
    map.fitBounds(bounds, { padding: CONFIG.fitPadding });
  })
  .catch(err => {
    console.error("Failed to load places.json", err);
  });


/* ============================================================
   LIGHTBOX
============================================================ */

function renderDots() {
  const dots = document.getElementById("lightbox-dots");
  dots.innerHTML = "";

  if (currentPhotos.length <= 1) return;

  currentPhotos.forEach((_, i) => {
    const dot = document.createElement("span");
    if (i === currentIndex) dot.classList.add("active");
    dot.onclick = () => showIndex(i);
    dots.appendChild(dot);
  });
}

function showIndex(i) {
  currentIndex = i;
  document.getElementById("lightbox-img").src =
    currentPhotos[currentIndex];
  renderDots();
}

function openLightbox(i) {
  document.getElementById("lightbox").style.display = "flex";
  showIndex(i);
}

function closeLightbox() {
  document.getElementById("lightbox").style.display = "none";
}

function showNext() {
  showIndex((currentIndex + 1) % currentPhotos.length);
}

function showPrev() {
  showIndex((currentIndex - 1 + currentPhotos.length) %
            currentPhotos.length);
}

// Controls
document.getElementById("lightbox-close").onclick = closeLightbox;
document.getElementById("lightbox-next").onclick = showNext;
document.getElementById("lightbox-prev").onclick = showPrev;

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowRight") showNext();
  if (e.key === "ArrowLeft") showPrev();
});

// Touch swipe support
let startX = null;

document.getElementById("lightbox")
  .addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
  });

document.getElementById("lightbox")
  .addEventListener("touchend", e => {
    if (startX === null) return;

    const diff = e.changedTouches[0].clientX - startX;
    if (diff > 50) showPrev();
    if (diff < -50) showNext();

    startX = null;
  });


/* ============================================================
   MOBILE SIDEBAR COLLAPSE + MAP RESIZE SYNC
============================================================ */

/*
  Leaflet does NOT automatically react to container size changes.
  When the sidebar height transitions (mobile), we must explicitly
  notify the map once the transition completes.
*/
if (sidebar) {
  sidebar.addEventListener("transitionend", e => {
    if (e.propertyName === "height") {
      map.invalidateSize();
    }
  });
}

// Toggle sidebar via handle
if (handle && sidebar) {
  handle.addEventListener("click", () => {
    sidebar.classList.toggle("collapsed");
    sidebar.classList.toggle("expanded");
  });
}

// Avoid accidental sidebar collapse when dragging map
let isDragging = false;

map.on("dragstart", () => isDragging = true);
map.on("dragend", () => isDragging = false);

map.on("click", () => {
  if (!isDragging && window.innerWidth <= CONFIG.mobileBreakpoint) {
    sidebar.classList.add("collapsed");
    sidebar.classList.remove("expanded");
  }
});
</script>

</body>
</html>
